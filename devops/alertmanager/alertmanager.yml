global:
  resolve_timeout: 5m

route:
  receiver: academic-console
  group_by: [alertname, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: academic-console

# This academic setup intentionally has no email/Slack receiver. Active alerts are
# visible at http://localhost:9093. Add a receiver only when you have its secret.

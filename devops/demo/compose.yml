name: e-biessa-ghcr-demo

x-api-environment: &api-environment
  SPRING_PROFILES_ACTIVE: ha
  HA_DB_URL: jdbc:mysql://mysql:3306/ebiessa_demo?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
  HA_DB_USERNAME: ebiessa_demo
  HA_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
  REDIS_HOST: redis
  CORS_ALLOWED_ORIGINS: http://localhost:4280,http://127.0.0.1:4280
  FRONTEND_URL: http://localhost:4280
  OAUTH_ENABLED: "false"
  RECOVERY_EMAIL_ENABLED: "false"
  RECOVERY_SMS_ENABLED: "false"
  CLOUDINARY_ENABLED: "false"
  LOCAL_UPLOAD_DIRECTORY: /app/uploads
  AI_SERVICE_ENABLED: "true"
  AI_SERVICE_URL: http://ai:8001
  AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Set AI_SERVICE_TOKEN}
  SERVER_SHUTDOWN: graceful
  SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 30s
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_HEALTH_READINESSSTATE_ENABLED: "true"
  LOGGING_LEVEL_COM_READDLYTECH: INFO

x-api: &api
  image: ghcr.io/jassernoomani/e-biessa-api:${IMAGE_TAG:?Set a numeric Jenkins build tag}
  environment: *api-environment
  mem_limit: 768m
  stop_grace_period: 40s
  restart: unless-stopped
  volumes: [uploads:/app/uploads]
  networks: [demo]
  depends_on:
    mysql: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ebiessa_demo
      MYSQL_USER: ebiessa_demo
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    mem_limit: 768m
    volumes: [mysql_data:/var/lib/mysql]
    networks: [demo]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes", --maxmemory, 128mb, --maxmemory-policy, noeviction]
    mem_limit: 192m
    volumes: [redis_data:/data]
    networks: [demo]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  # Explicit, first-run-only schema/fixture initialization. No published port.
  # Stop this service before starting the replicas, which use schema validation.
  bootstrap:
    <<: *api
    profiles: [bootstrap]
    restart: "no"
    environment:
      <<: *api-environment
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:mysql://mysql:3306/ebiessa_demo?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: ebiessa_demo
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      JPA_DDL_AUTO: update
      AI_SERVICE_ENABLED: "false"

  api-1: *api
  api-2: *api

  ai:
    image: ghcr.io/jassernoomani/e-biessa-ai:${IMAGE_TAG:?Set a numeric Jenkins build tag}
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Set AI_SERVICE_TOKEN}
      OLLAMA_ENABLED: "true"
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: e-biessa-query-v2
      VISION_ENABLED: "false"
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: [ai_data:/app/data]
    mem_limit: 1536m
    networks: [demo]
    restart: unless-stopped

  web:
    image: ghcr.io/jassernoomani/e-biessa-web:${IMAGE_TAG:?Set a numeric Jenkins build tag}
    mem_limit: 128m
    networks: [demo]
    restart: unless-stopped

  gateway:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:4280:80"]
    volumes: ["./gateway.conf:/etc/nginx/conf.d/default.conf:ro"]
    mem_limit: 128m
    networks: [demo]
    depends_on:
      api-1: {condition: service_healthy}
      api-2: {condition: service_healthy}
      web: {condition: service_started}
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    ports: ["127.0.0.1:19090:9090"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=3d"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    mem_limit: 256m
    networks: [demo]

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [monitoring]
    ports: ["127.0.0.1:13000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    mem_limit: 256m
    networks: [demo]

networks:
  demo: {}

volumes:
  mysql_data: {}
  redis_data: {}
  uploads: {}
  ai_data: {}
  prometheus_data: {}
  grafana_data: {}

resolver 127.0.0.11 valid=5s ipv6=off;
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
upstream marketplace {
    zone marketplace 64k;
    server api-1:8080 resolve max_fails=1 fail_timeout=5s;
    server api-2:8080 resolve max_fails=1 fail_timeout=5s;
}
upstream frontend {
    zone frontend 64k;
    server web:80 resolve;
}
server {
    listen 80;
    client_max_body_size 30m;
    # Only the local demo exposes this attribution marker.
    add_header X-Demo-Upstream $upstream_addr always;
    location = /runtime-config.js {
        default_type application/javascript;
        add_header Cache-Control "no-store";
        return 200 'window.EBIESSA_CONFIG = { apiBaseUrl: "/api" };';
    }
    location = /healthz { return 200 'gateway alive\n'; }
    location ~ ^/(api|uploads|ws)(/|$) {
        proxy_pass http://marketplace;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Do not trust client-supplied forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 120s;
        # Never retry a mutation: ambiguous sends must be surfaced to the caller.
        proxy_next_upstream off;
        error_page 502 504 =503 @unavailable;
    }
    location @unavailable {
        default_type application/json;
        return 503 '{"message":"The demo backend is temporarily unavailable. Please try again."}';
    }
    # Management endpoints stay private on the Compose network.
    location /actuator { return 404; }
    location / { proxy_pass http://frontend; proxy_set_header Host $http_host; }
}

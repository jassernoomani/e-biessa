groups:
  - name: e-biessa-availability
    rules:
      - alert: EBiessaEndpointDown
        expr: probe_success{job="blackbox-http"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "E-biessa endpoint is unavailable"
          description: "{{ $labels.instance }} has failed the HTTP probe for more than two minutes."

      - alert: EBiessaMetricsTargetDown
        expr: up{job=~"e-biessa-spring|e-biessa-fastapi"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "E-biessa metrics target is down"
          description: "Prometheus cannot scrape {{ $labels.job }} at {{ $labels.instance }}."

      - alert: SpringHighServerErrorRate
        expr: sum(rate(http_server_requests_seconds_count{job="e-biessa-spring",status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{job="e-biessa-spring"}[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Spring API has an elevated 5xx ratio"
          description: "More than 5% of Spring requests have failed for five minutes."

      - alert: FastApiHighServerErrorRate
        expr: sum(rate(e_biessa_ai_http_requests_total{job="e-biessa-fastapi",status=~"5.."}[5m])) / clamp_min(sum(rate(e_biessa_ai_http_requests_total{job="e-biessa-fastapi"}[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AI service has an elevated 5xx ratio"
          description: "More than 5% of AI requests have failed for five minutes."

# Opt-in only. Do not enable against the user's database for fault tests.
spring.datasource.url=${HA_DB_URL}
spring.datasource.username=${HA_DB_USERNAME}
spring.datasource.password=${HA_DB_PASSWORD}
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=1s
spring.data.redis.timeout=1s
spring.jpa.hibernate.ddl-auto=validate

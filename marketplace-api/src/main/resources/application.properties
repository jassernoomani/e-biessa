# Database
# `.env` is imported as a properties file, so explicitly bridge its uppercase
# environment-style key to Spring's profile setting.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/marketplace?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Server Configuration
server.port=8080

# Security: JWT_SECRET must be at least 32 bytes.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

# CarQuery vehicle catalog. Calls are proxied by the backend to avoid browser CORS issues.
# Results are not persisted. Local listing vehicles are used whenever CarQuery is unavailable.
app.car-query.enabled=${CAR_QUERY_ENABLED:true}
app.car-query.base-url=${CAR_QUERY_BASE_URL:https://www.carqueryapi.com/api/0.3/}
app.car-query.timeout-seconds=${CAR_QUERY_TIMEOUT_SECONDS:5}

# VIN decoding. The public decoder identifies a vehicle; local listing fitment remains authoritative.
app.vin-decoder.enabled=${VIN_DECODER_ENABLED:true}
app.vin-decoder.base-url=${VIN_DECODER_BASE_URL:https://vpic.nhtsa.dot.gov/api}
app.vin-decoder.timeout-seconds=${VIN_DECODER_TIMEOUT_SECONDS:8}
app.vin-decoder.cache-hours=${VIN_DECODER_CACHE_HOURS:24}

# Social login. Enable after adding at least one provider's client credentials.
app.oauth.enabled=${OAUTH_ENABLED:false}
app.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.oauth.facebook.client-id=${FACEBOOK_CLIENT_ID:}
app.oauth.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:}
app.oauth.microsoft.client-id=${MICROSOFT_CLIENT_ID:}
app.oauth.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:}

# Account recovery. Development returns the code in the response; production does not.
app.recovery.code-minutes=${RECOVERY_CODE_MINUTES:10}
app.recovery.email.enabled=${RECOVERY_EMAIL_ENABLED:false}
app.recovery.sms.enabled=${RECOVERY_SMS_ENABLED:false}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
app.recovery.sms.account-sid=${TWILIO_ACCOUNT_SID:}
app.recovery.sms.auth-token=${TWILIO_AUTH_TOKEN:}
app.recovery.sms.from=${TWILIO_FROM_NUMBER:}

# Images: local storage is the development fallback. Enable Cloudinary in production.
app.storage.local-directory=${LOCAL_UPLOAD_DIRECTORY:uploads}
app.storage.max-file-size-bytes=${MAX_IMAGE_SIZE_BYTES:5242880}
cloudinary.enabled=${CLOUDINARY_ENABLED:false}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB

# Phase 2 semantic retrieval service. Marketplace writes remain available when this service is offline.
app.ai.enabled=${AI_SERVICE_ENABLED:false}
app.ai.base-url=${AI_SERVICE_URL:http://127.0.0.1:8001}
app.ai.token=${AI_SERVICE_TOKEN:}
app.ai.connect-timeout-seconds=${AI_CONNECT_TIMEOUT_SECONDS:3}
app.ai.read-timeout-seconds=${AI_READ_TIMEOUT_SECONDS:95}
app.ai.search.rate-limit.requests=${AI_SEARCH_RATE_LIMIT_REQUESTS:12}
app.ai.search.rate-limit.window-seconds=${AI_SEARCH_RATE_LIMIT_WINDOW_SECONDS:60}
app.ai.search.max-concurrent=${AI_SEARCH_MAX_CONCURRENT:2}
app.ai.search.acquire-timeout-ms=${AI_SEARCH_ACQUIRE_TIMEOUT_MS:500}
app.ai.search.cache-seconds=${AI_SEARCH_CACHE_SECONDS:120}

# Logging
logging.level.org.springframework=INFO
logging.level.com.readdlytech.marketplaceapi=DEBUG

# Local observability. Only non-sensitive health and metrics endpoints are exposed.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.info.enabled=true
management.health.mail.enabled=${RECOVERY_EMAIL_ENABLED:false}
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=e-biessa-marketplace-api
management.info.env.enabled=true
info.app.name=E-biessa Marketplace API
info.app.description=Transactional marketplace and authorization boundary


spring.config.import=optional:file:.env[.properties]
# Redis is optional for local operation, and must not control core health.
spring.data.redis.repositories.enabled=false
management.health.redis.enabled=false

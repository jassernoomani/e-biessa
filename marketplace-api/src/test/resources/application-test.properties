spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
jwt.secret=test-secret-that-is-longer-than-thirty-two-bytes
jwt.expiration=3600000
app.cors.allowed-origins=http://localhost:3000
app.storage.local-directory=target/test-uploads
app.storage.max-file-size-bytes=5242880
cloudinary.enabled=false
app.oauth.enabled=false
app.car-query.enabled=false
app.ai.enabled=false
logging.level.root=WARN
